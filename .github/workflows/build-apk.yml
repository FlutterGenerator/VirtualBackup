name: Virtual Backup 32 / 64 Build
permissions:
  contents: write

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs (arch32 + arch64)
        run: ./gradlew assembleDebug --warning-mode all

      - name: Upload Gradle Problem Report
        uses: actions/upload-artifact@v7
        with:
          name: gradle-problem-report-${{ github.run_id }}
          path: build/reports/problems/
          if-no-files-found: warn

      - name: Upload APK (arch32)
        uses: actions/upload-artifact@v7
        with:
          name: Virtual-Backup-32-apk-debug-${{ github.run_id }}
          path: app/build/outputs/apk/arch32/debug/app-arch32-debug.apk
          if-no-files-found: error

      - name: Upload APK (arch64)
        uses: actions/upload-artifact@v7
        with:
          name: Virtual-Backup-64-apk-debug-${{ github.run_id }}
          path: app/build/outputs/apk/arch64/debug/app-arch64-debug.apk
          if-no-files-found: error
